name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          # Pick whatever iPhone simulator the runner image actually ships —
          # pinning a name (e.g. "iPhone 16") rots each time the image updates.
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)
          echo "Using simulator UDID: $UDID"
          xcodebuild test \
            -project Bloom.xcodeproj \
            -scheme Bloom \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
          | xcbeautify

      - name: Coverage summary
        if: always()
        run: xcrun xccov view --report TestResults.xcresult | head -30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
