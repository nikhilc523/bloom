# XcodeGen spec — source of truth for Bloom.xcodeproj (which is gitignored).
# Regenerate with: xcodegen generate
name: Bloom
options:
  bundleIdPrefix: com.nikhilc523
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Device builds (the Stage-4 two-phone sync test) must be signable, so we no
    # longer force `CODE_SIGNING_ALLOWED: NO` here. CI/local simulator runs pass
    # `CODE_SIGNING_ALLOWED=NO` on the xcodebuild command line and are unaffected.
    # Set your Team in Xcode → Signing & Capabilities (Automatic signing) to build
    # on device; DEVELOPMENT_TEAM stays empty in the committed spec on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Bloom:
    type: application
    platform: iOS
    sources:
      - path: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Bloom
        TARGETED_DEVICE_FAMILY: "1"
        # Stage 4 — CloudKit private-DB sync. Entitlements grant the iCloud
        # container; the background mode lets silent CloudKit pushes wake the
        # app to pull remote changes. Signing (team + provisioning that includes
        # the iCloud container) is set in Xcode for device builds; CI builds with
        # CODE_SIGNING_ALLOWED=NO, which skips entitlement application.
        CODE_SIGN_ENTITLEMENTS: Bloom/Bloom.entitlements
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        # Stage 5 — HealthKit. Both usage strings are mandatory: requesting
        # authorization without them crashes the app. They surface in the iOS
        # permission sheet, so phrase them for her, honestly.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Bloom reads your Cycle Tracking data (period, fertility signs, basal body temperature) from Apple Health so your log stays in sync across your devices."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Bloom saves the periods and cycle details you log into Apple Health, so Cycle Tracking and your other apps stay up to date."

  BloomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BloomTests
    dependencies:
      - target: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom.tests
        GENERATE_INFOPLIST_FILE: "YES"

  BloomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BloomUITests
    dependencies:
      - target: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Bloom:
    build:
      targets:
        Bloom: all
        BloomTests: [test]
        BloomUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Bloom
      targets:
        - BloomTests
        - BloomUITests
    run:
      commandLineArguments:
        "-uiTesting": false
