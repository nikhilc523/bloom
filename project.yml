# XcodeGen spec — source of truth for Bloom.xcodeproj (which is gitignored).
# Regenerate with: xcodegen generate
name: Bloom
options:
  bundleIdPrefix: com.nikhilc523
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Bloom:
    type: application
    platform: iOS
    sources:
      - path: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Bloom
        TARGETED_DEVICE_FAMILY: "1"

  BloomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BloomTests
    dependencies:
      - target: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom.tests
        GENERATE_INFOPLIST_FILE: "YES"

  BloomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BloomUITests
    dependencies:
      - target: Bloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc523.bloom.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Bloom:
    build:
      targets:
        Bloom: all
        BloomTests: [test]
        BloomUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Bloom
      targets:
        - BloomTests
        - BloomUITests
    run:
      commandLineArguments:
        "-uiTesting": false
